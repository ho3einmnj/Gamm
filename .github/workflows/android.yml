name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # تنظیم نسخه جاوا ۲۱ (الزامی برای نسخه‌های جدید گرادل و کپسیتر)
      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # تنظیم محیط Node.js
      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # آماده‌سازی و انتقال فایل‌های وب به پوشه www
      - name: Prepare Web Assets
        run: |
          mkdir -p www
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip -d temp_unzip
            if [ -f temp_unzip/index.html ]; then
              cp -r temp_unzip/* www/
            else
              SOURCE_DIR=$(find temp_unzip -name "index.html" -exec dirname {} \; | head -n 1)
              cp -r "$SOURCE_DIR"/* www/
            fi
          elif [ -f index.html ]; then
            cp -r * www/ 2>/dev/null || true
            cp index.html www/
          fi

      # نصب Capacitor و ایجاد ساختار پروژه اندروید
      - name: Initialize Capacitor & Android Project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "ClassicalGuitar" "com.guitar.classical" --web-dir www
          npx cap add android

          # رفع تداخل نسخه‌های کاتلین در زمان بیلد
          cat << 'EOF' >> android/app/build.gradle

          dependencies {
              implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
          }

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF

      # کامپایل فایل نصبی APK با گرادل
      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # آپلود فایل نصبی برای دانلود
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Classical-Guitar-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
